# Test profile: in-memory database, no external services required.
spring:
  datasource:
    url: jdbc:h2:mem:diyncrafts;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  # Flyway migrations are MySQL-specific and are verified against MySQL in FlywayMigrationIT;
  # the fast suite uses H2 with a schema generated from the entities.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false

  elasticsearch:
    # Nothing listens here: search requests fail fast, exercising the 503 path.
    uris: http://localhost:1

app:
  search:
    initialize-index: false
  storage:
    bucket: test-bucket
    region: eu-west-2
    public-base-url: https://cdn.test
  transcoding:
    work-dir: ${java.io.tmpdir}/diyncrafts-test
  jwt:
    secret: test-only-secret-not-used-anywhere-else-0123456789
  websocket:
    relay:
      enabled: false

management:
  health:
    rabbit:
      enabled: false
    elasticsearch:
      enabled: false
