# Base configuration. Contains NO credentials: supply them through environment variables
# (see .env.example and README). Spring maps e.g. SPRING_DATASOURCE_PASSWORD -> spring.datasource.password.
spring:
  application:
    name: diyncrafts
  datasource:
    url: jdbc:mysql://localhost:3306/diyncraftshub
    # username/password: SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes are made by Flyway migrations (src/main/resources/db/migration) only.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # Databases created by the old ddl-auto=update setup are adopted as version 1 (the legacy schema).
    baseline-on-migrate: true
    baseline-version: 1
  data:
    web:
      pageable:
        default-page-size: 12
        max-page-size: 100
  elasticsearch:
    uris: http://localhost:9200
    # username/password: SPRING_ELASTICSEARCH_USERNAME / SPRING_ELASTICSEARCH_PASSWORD
  rabbitmq:
    host: localhost
    port: 5672
    # username/password: SPRING_RABBITMQ_USERNAME / SPRING_RABBITMQ_PASSWORD
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

app:
  jwt:
    # secret: APP_JWT_SECRET (required, >= 32 characters, e.g. `openssl rand -base64 48`)
    expiration: 1h
    issuer: diyncrafts
  cors:
    allowed-origins: http://localhost:5173
  websocket:
    relay:
      enabled: false
  storage:
    bucket: diyncrafts-storage
    region: eu-west-2
    # endpoint: http://localhost:9000   # S3-compatible services (MinIO, LocalStack)
    # path-style-access: true
    # public-base-url: https://cdn.example.com
  search:
    initialize-index: true
  transcoding:
    work-dir: ${java.io.tmpdir}/diyncrafts

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
