# Local development against docker-compose.yml. These credentials only exist in the throwaway local
# containers; never reuse them anywhere else. APP_JWT_SECRET must still be set (see README).
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/diyncraftshub
    username: diyncrafts
    password: diyncrafts-local
  rabbitmq:
    username: diyncrafts
    password: diyncrafts-local

app:
  websocket:
    relay:
      enabled: true
  storage:
    # Adobe S3Mock from docker-compose. It ignores credentials, but the AWS SDK still needs some:
    # export AWS_ACCESS_KEY_ID=local AWS_SECRET_ACCESS_KEY=local
    bucket: diyncrafts-local
    region: us-east-1
    endpoint: http://localhost:9090
    path-style-access: true
    public-base-url: http://localhost:9090/diyncrafts-local
  transcoding:
    # Compose raises RabbitMQ's consumer_timeout to 2h, so longer local jobs are fine.
    timeout: 90m
