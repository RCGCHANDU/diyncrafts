# Transcoding jobs stay unacknowledged while ffmpeg runs; keep this above app.transcoding.timeout (25m).
# 1 hour, in milliseconds.
consumer_timeout = 3600000
# The guest account is only usable from localhost inside the container; the application user comes
# from the credentials file mounted from the secrets directory.
loopback_users.guest = true
# Refuse publishes before the disk fills (the broker blocks publishers below this limit).
disk_free_limit.absolute = 2GB
