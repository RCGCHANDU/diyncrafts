# Prometheus scrape configuration for the DIYnCrafts host (see compose.monitoring.yaml).
# Targets are found through Docker's embedded DNS, so only the colours that are running are scraped.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# Alert delivery (email, chat, paging) is an operator decision: run Alertmanager with the chosen
# receivers and uncomment this block.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: diyncrafts
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api-blue, api-green, worker-blue, worker-green]
        type: A
        port: 8080
        refresh_interval: 15s
    relabel_configs:
      # role="api"|"worker", colour="blue"|"green"
      - source_labels: [__meta_dns_name]
        regex: "(api|worker)-(blue|green)"
        target_label: role
        replacement: "$1"
      - source_labels: [__meta_dns_name]
        regex: "(api|worker)-(blue|green)"
        target_label: colour
        replacement: "$2"
      - source_labels: [__meta_dns_name]
        target_label: instance

  # Only when compose.stateful.yaml runs RabbitMQ on this host (rabbitmq_prometheus plugin).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    dns_sd_configs:
      - names: [rabbitmq]
        type: A
        port: 15692
