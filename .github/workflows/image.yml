# Builds the backend image, scans it and (on main) publishes it to GHCR by digest.
# Called from ci.yml; permissions come from the calling job (packages: write only when publishing).
name: Image

on:
  workflow_call:
    inputs:
      push:
        description: Publish to GHCR (main only)
        type: boolean
        required: true
    outputs:
      image:
        description: Published reference (repository@sha256:...), empty when not published
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

env:
  # Pinned by digest; Dependabot does not update this line, so bump it deliberately.
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.ref.outputs.published }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Image name
        # GHCR names must be lower case.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          # One immutable tag per commit; deployments always use the digest.
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
          # Build provenance and an SBOM are attached to the published image as attestations.
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reference
        id: ref
        env:
          PUSH: ${{ inputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ $PUSH == true ]]; then
            echo "scan=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
            echo "published=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "scan=$IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      # Fails on fixable HIGH/CRITICAL vulnerabilities. Accepted exceptions go in .trivyignore with
      # a reason and an expiry date. A published image that fails here is never deployed, because
      # the Deploy workflow only runs after a successful CI run.
      - name: Scan (Trivy)
        env:
          REF: ${{ steps.ref.outputs.scan }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --ignorefile /src/.trivyignore "$REF"

      - name: SBOM (SPDX)
        if: ${{ !cancelled() }}
        env:
          REF: ${{ steps.ref.outputs.scan }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" image \
            --format spdx-json --output /out/sbom.spdx.json "$REF"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: backend-sbom
          path: ${{ runner.temp }}/sbom.spdx.json
          retention-days: 90

      - name: Record the published reference
        if: inputs.push
        env:
          REF: ${{ steps.ref.outputs.published }}
        run: |
          echo "$REF" > "$RUNNER_TEMP/image-ref.txt"
          {
            echo "### Backend image"
            echo
            echo "\`$REF\`"
            echo
            echo "Tag: \`$IMAGE:sha-$GITHUB_SHA\` (for people; deployments use the digest)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Read by the Deploy workflow (staging) after this run succeeds.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.push
        with:
          name: backend-image
          path: ${{ runner.temp }}/image-ref.txt
          retention-days: 90
