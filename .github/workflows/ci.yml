name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Real-ffmpeg tests are skipped when ffmpeg is missing; install it so they run in CI.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      # Unit/API tests (surefire) plus Testcontainers integration tests (failsafe) against MySQL,
      # Elasticsearch and RabbitMQ; Docker is available on GitHub-hosted runners.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  # Deployment definitions: shell scripts, Compose files and the edge configuration.
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck deploy/bin/* deploy/host/*.sh
      - name: Compose files
        run: |
          docker network create diyncrafts
          # The example files stand in for the host's /etc/diyncrafts.
          export DIYNCRAFTS_ETC="$RUNNER_TEMP"
          cp deploy/compose/stack.env.example "$RUNNER_TEMP/stack.env"
          cp deploy/compose/backend.env.example "$RUNNER_TEMP/backend.env"
          touch "$RUNNER_TEMP/images.env"
          docker compose -f deploy/compose/compose.yaml --env-file "$RUNNER_TEMP/stack.env" \
            --env-file "$RUNNER_TEMP/images.env" config --quiet
          docker compose -f deploy/compose/compose.stateful.yaml --env-file "$RUNNER_TEMP/stack.env" config --quiet
      - name: Caddyfile
        run: |
          docker run --rm -e SITE_ADDRESS=example.com -v "$PWD/deploy/caddy:/etc/caddy:ro" \
            caddy:2.11-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b \
            caddy validate --config /etc/caddy/Caddyfile

  # Pull requests: build and scan, never publish.
  image:
    needs: build
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/image.yml
    with:
      push: false

  # main: build once, scan, publish by digest. The Deploy workflow takes it from here.
  publish:
    needs: [build, deploy-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: true
